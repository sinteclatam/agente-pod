# Bloqueo de shell. RBAC ya no concede pods/exec, pero un administrador del clúster sí lo tiene
# por defecto; esta política lo niega para todo el namespace, venga de quien venga.
# Requiere Kubernetes 1.30+ (ValidatingAdmissionPolicy en v1).
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: agente-pod-sin-shell
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CONNECT"]
        resources: ["pods/exec", "pods/attach", "pods/portforward"]
  validations:
    - expression: "false"
      message: "En este namespace no se entra por shell: el agente solo se maneja desde Claude Remote Control."
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: agente-pod-sin-shell
spec:
  policyName: agente-pod-sin-shell
  validationActions: ["Deny"]
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: agentes
