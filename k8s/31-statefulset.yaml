apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: agente-pod
  namespace: agentes
  labels:
    app.kubernetes.io/name: agente-pod
spec:
  serviceName: agente-pod
  # El número de agentes manda desde el ConfigMap: 'bin/aplicar.sh' lo lee y escala aquí.
  replicas: 1
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app.kubernetes.io/name: agente-pod
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agente-pod
    spec:
      serviceAccountName: agente-pod
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agente
          image: ghcr.io/sinteclatam/agente-pod:latest
          # Con un tag fijo (recomendado) puedes bajarlo a IfNotPresent.
          imagePullPolicy: Always
          args: ["agente"]
          env:
            # El nombre de la sesión en claude.ai es el del pod: agente-pod-0, agente-pod-1...
            - name: NOMBRE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          envFrom:
            - configMapRef:
                name: agente-pod-config
            - secretRef:
                name: agente-pod-tokens
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: estado
              mountPath: /home/agente
            - name: temporal
              mountPath: /tmp
            - name: credenciales
              mountPath: /secretos
              readOnly: true
          # Arranque: margen para sembrar el volumen y levantar el proceso.
          startupProbe:
            exec:
              command: ["/opt/agente/bin/salud.sh", "vivo"]
            periodSeconds: 15
            failureThreshold: 20
          livenessProbe:
            exec:
              command: ["/opt/agente/bin/salud.sh", "vivo"]
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            exec:
              command: ["/opt/agente/bin/salud.sh", "listo"]
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 4
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 3Gi
      volumes:
        - name: temporal
          emptyDir:
            sizeLimit: 2Gi
        - name: credenciales
          secret:
            secretName: agente-pod-credenciales
            # 0440, no 0400: el fichero queda root:fsGroup y el agente (uid 10001)
            # lo lee por el grupo.
            defaultMode: 0440
  volumeClaimTemplates:
    - metadata:
        name: estado
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
