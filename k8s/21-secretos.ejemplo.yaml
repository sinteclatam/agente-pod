# PLANTILLA. No la apliques con estos valores ni la subas rellena: los secretos se crean en el
# clúster con 'kubectl create secret' (ver docs/OPERACION.md), no en git.
#
# 1) Token de GitHub (classic o fine-grained con acceso a la organización):
#      kubectl -n agentes create secret generic agente-pod-tokens \
#        --from-literal=GH_TOKEN=ghp_xxx
#
# 2) Credenciales de claude.ai, generadas con 'make credenciales':
#      kubectl -n agentes create secret generic agente-pod-credenciales \
#        --from-file=credentials.json=./.credenciales/credentials.json
#
#    Para que cada agente use una cuenta distinta, usa una clave por ordinal:
#      --from-file=credentials-0.json=... --from-file=credentials-1.json=...
---
apiVersion: v1
kind: Secret
metadata:
  name: agente-pod-tokens
  namespace: agentes
type: Opaque
stringData:
  GH_TOKEN: "REEMPLAZAR"
---
apiVersion: v1
kind: Secret
metadata:
  name: agente-pod-credenciales
  namespace: agentes
type: Opaque
stringData:
  credentials.json: "REEMPLAZAR"
