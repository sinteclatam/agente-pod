# Permisos del agente. La ausencia de pods/exec, pods/attach y pods/portforward es deliberada:
# ni un humano ni el propio agente pueden abrirse una shell dentro de los pods.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: agente-pod-desplegador
rules:
  - apiGroups: [""]
    resources:
      - pods
      - services
      - configmaps
      - secrets
      - serviceaccounts
      - persistentvolumeclaims
      - endpoints
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods/log", "pods/status", "events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale", "statefulsets/scale", "deployments/status", "statefulsets/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "networkpolicies"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
# Solo lectura a lo que es del clúster entero, para diagnosticar.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: agente-pod-lector
rules:
  - apiGroups: [""]
    resources: ["nodes", "namespaces", "persistentvolumes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingressclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods", "nodes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: agente-pod-lector
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: agente-pod-lector
subjects:
  - kind: ServiceAccount
    name: agente-pod
    namespace: agentes
---
# Puede desplegar en su propio namespace. Para darle otro, copia este RoleBinding cambiando
# 'namespace' — así el alcance del agente se ve de un vistazo en el repo.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agente-pod-desplegador
  namespace: agentes
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: agente-pod-desplegador
subjects:
  - kind: ServiceAccount
    name: agente-pod
    namespace: agentes
