# Sin conexiones entrantes; de salida, solo DNS, HTTPS y el API server.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agente-pod
  namespace: agentes
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: agente-pod
  policyTypes: ["Ingress", "Egress"]
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # api.anthropic.com (Remote Control), github.com, registries y el API server. Restringir esto
    # por IP no es práctico: son rangos de CDN que cambian.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 169.254.169.254/32   # metadatos de la nube
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443
