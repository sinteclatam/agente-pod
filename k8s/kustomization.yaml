apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Sin 'namespace:' global a propósito: cada manifiesto declara el suyo y así kustomize no se lo
# cuela a los recursos de clúster (ValidatingAdmissionPolicy no está en su catálogo y lo trataría
# como si fuera de namespace, que el API server rechaza).

resources:
  - 00-namespace.yaml
  - 10-serviceaccount.yaml
  - 11-rbac.yaml
  - 20-configmap.yaml
  - 30-service.yaml
  - 31-statefulset.yaml
  - 40-networkpolicy.yaml
  - 41-admision-sin-exec.yaml
  # Los secretos NO se aplican desde aquí: se crean con kubectl (ver docs/OPERACION.md).

images:
  - name: ghcr.io/sinteclatam/agente-pod
    newTag: latest

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/part-of: agente-pod
      app.kubernetes.io/managed-by: kustomize
